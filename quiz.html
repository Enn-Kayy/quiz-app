<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Take Quiz</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .container {
      text-align: center;
      margin-top: 40px;
    }

    .question-block {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    input[type="radio"] {
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Attempt Quiz</h2>
    <div id="quizContainer"></div>
    <button onclick="submitQuiz()">Submit Quiz</button>
    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
